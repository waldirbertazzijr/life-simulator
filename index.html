<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Life Simulator</title>
    <script src="stats.js"></script>
    <script type="module" src="main.js"></script>
    <style>
        * { margin:0; padding:0; }
        html, body { width:100%; height:100%; }
        .panel { background: rgba(255, 255, 255, 0.8); box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5); border: 1px solid rgb(0,0,0,0.8); border-radius: 5px; padding: 5px; font: 12px Helvetica, Arial; }
        #canvas { display:block; }
        #controls { position: absolute; top: 10px; right: 10px; z-index: 10;  }
        /* Tooltip CSS */
        #tooltip {
            position: absolute;
            display: none;
            pointer-events: none; z-index: 1;
        }
        .add_animal { background: lightgreen; border-radius: 5px; border: 1px solid #000; padding: 5px 10px; }
        .add_animal:hover { background: lightgoldenrodyellow; }
    </style>
</head>
<body>
    <div class="panel" id="controls">
        <div id="time-display" style="margin-bottom: 4px; font-weight: bold; text-align: center;">12:00 AM</div>
        <div id="world-size-display" style="margin-bottom: 10px; font-size: 11px; text-align: center; color: #555;">world: —</div>
        <div style="margin-bottom: 10px;">
            <button id="pause-btn" style="padding: 5px 15px; background: #FFD700; border: 1px solid #000; border-radius: 5px; cursor: pointer;">⏸ Pause</button>
        </div>
        <div style="margin-bottom: 10px;">
            <label style="font-size: 11px; font-weight: bold;">Speed:</label>
            <div id="speed-controls" style="margin-top: 5px;">
                <button class="speed-btn" data-speed="0.5" style="padding: 3px 8px; margin: 2px; background: #ddd; border: 1px solid #000; border-radius: 3px; cursor: pointer; font-size: 10px;">0.5x</button>
                <button class="speed-btn" data-speed="1" style="padding: 3px 8px; margin: 2px; background: #90EE90; border: 1px solid #000; border-radius: 3px; cursor: pointer; font-size: 10px;">1x</button>
                <button class="speed-btn" data-speed="2" style="padding: 3px 8px; margin: 2px; background: #ddd; border: 1px solid #000; border-radius: 3px; cursor: pointer; font-size: 10px;">2x</button>
                <button class="speed-btn" data-speed="5" style="padding: 3px 8px; margin: 2px; background: #ddd; border: 1px solid #000; border-radius: 3px; cursor: pointer; font-size: 10px;">5x</button>
            </div>
        </div>
        <hr style="margin: 10px 0;">
        <button class="add_animal" animal="tree">Add Tree</button>
        <button class="add_animal" animal="herbivore">Add Herbivore</button>
        <button class="add_animal" animal="carnivore">Add Carnivore</button>
    </div>
    <div id="tooltip"></div>
    <canvas id="canvas"></canvas>
</body>
</html>
