<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Life Simulator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <script src="stats.js"></script>
    <script type="module" src="main.js"></script>
    <style>
        :root {
            --bg: #12141f;          /* panel background */
            --edge: #5a6488;        /* panel border      */
            --ink: #d7dce8;         /* body text         */
            --dim: #8892b0;         /* muted text        */
            --amber: #ffd866;       /* accent / headings */
            --tree: #7ee787;
            --herb: #ffa657;
            --carn: #ff7b72;
            --btn: #8aa0c8;
            --screen: #0a0c16;      /* chart "LCD" bg     */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }

        #canvas { display: block; image-rendering: pixelated; }

        /* ---- 8-bit panel chrome (shared by all HUD panels) ---- */
        .panel {
            background: rgba(18, 20, 31, 0.92);
            color: var(--ink);
            border: 2px solid var(--edge);
            border-radius: 0;                          /* sharp = pixel */
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.55); /* hard drop shadow, no blur */
            padding: 9px 10px;
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.05;
            image-rendering: pixelated;
        }
        .panel h3 {
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--amber);
            margin: 0 0 8px;
            line-height: 1.4;
        }
        .panel canvas { border: 2px solid var(--edge); background: var(--screen); display: block; }

        /* ---- buttons ---- */
        button {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            color: var(--bg);
            background: var(--btn);
            border: 2px solid #0a0c16;
            border-radius: 0;
            box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.5);
            padding: 7px 8px;
            cursor: pointer;
            line-height: 1;
        }
        button:hover { filter: brightness(1.12); }
        button:active { transform: translate(2px, 2px); box-shadow: none; }
        .add_animal { font-size: 15px; padding: 5px 9px; } /* emoji buttons a touch bigger */

        /* ---- controls (top-right) ---- */
        #controls { position: absolute; top: 12px; right: 12px; z-index: 10; width: 168px; }
        .hud-time { font-size: 20px; color: var(--amber); text-align: center; letter-spacing: .5px; }
        .hud-sub  { font-size: 14px; color: var(--dim); text-align: center; margin-bottom: 9px; }
        .row { display: flex; gap: 5px; align-items: stretch; margin-bottom: 8px; }
        #pause-btn { flex: 0 0 auto; }
        .speed-group { display: flex; gap: 3px; flex: 1; }
        .speed-btn { flex: 1; padding: 7px 0; }
        .spawn-group { display: flex; gap: 5px; }
        .spawn-group .add_animal { flex: 1; text-align: center; }
        .sep { height: 2px; background: var(--edge); margin: 9px 0; }

        /* ---- collapsible panels ---- */
        .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
        .panel-header h3 { margin: 0; }
        .panel-toggle { font-size: 8px; padding: 4px 6px; }
        .chart-toggle {
            font-family: 'VT323', monospace; font-size: 14px; text-transform: none;
            color: var(--amber); background: none; border: none; box-shadow: none;
            padding: 2px 0 4px; cursor: pointer;
        }
        .chart-toggle:hover { filter: none; text-decoration: underline; }
        .chart-toggle:active { transform: none; box-shadow: none; }

        /* retro thin scrollbar (only shows when charts are expanded) */
        .panel::-webkit-scrollbar { width: 9px; height: 9px; }
        .panel::-webkit-scrollbar-track { background: #0a0c16; }
        .panel::-webkit-scrollbar-thumb { background: #3a4770; border: 2px solid #0a0c16; }

        /* ---- tooltip ---- */
        #tooltip { position: absolute; display: none; pointer-events: none; z-index: 20; max-width: 240px; }
    </style>
</head>
<body>
    <div class="panel" id="controls">
        <div id="time-display" class="hud-time">DAY 1 · 12:00</div>
        <div id="world-size-display" class="hud-sub">world —</div>
        <div class="row">
            <button id="pause-btn" title="Pause / Play">⏸</button>
            <div class="speed-group">
                <button class="speed-btn" data-speed="0.5">½×</button>
                <button class="speed-btn" data-speed="1">1×</button>
                <button class="speed-btn" data-speed="2">2×</button>
                <button class="speed-btn" data-speed="5">5×</button>
            </div>
        </div>
        <div class="sep"></div>
        <div class="spawn-group">
            <button class="add_animal" animal="tree" title="Add tree">🌳</button>
            <button class="add_animal" animal="herbivore" title="Add herbivore">🦌</button>
            <button class="add_animal" animal="carnivore" title="Add carnivore">🦁</button>
        </div>
    </div>
    <div id="tooltip" class="panel"></div>
    <canvas id="canvas"></canvas>
</body>
</html>
